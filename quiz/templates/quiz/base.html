<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>securITquiz</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f7f6; color: #333; }
        .navbar { background-color: #003366; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; color: white; }
        .navbar a { color: white; text-decoration: none; margin-left: 20px; font-weight: bold; }
        .navbar a:hover { color: #FFD700; }
        .logo { font-size: 24px; font-weight: bold; color: #FFD700; }
        .container { max-width: 900px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .btn { background-color: #003366; color: white; padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; display: inline-block; }
        .btn:hover { background-color: #FFD700; color: #003366; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #003366; color: white; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">securITquiz</div>
        <div>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'student_dashboard' %}">Student Dashboard</a>
            <a href="{% url 'instructor_dashboard' %}">Instructor Dashboard</a>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
